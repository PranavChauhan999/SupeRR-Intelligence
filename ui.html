<script>
'use strict';
const $=s=>document.querySelector(s),root=$('#view'),dialog=$('#profile'),tip=$('#tip');
const paths={overview:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',rankings:'M5 19v-6h3v6z M10.5 19V5h3v14z M16 19V9h3v10z',compare:'M7 3v18 M17 3v18 M3 8h8 M13 15h8',method:'M4 4h12a4 4 0 0 1 4 4v13a4 4 0 0 0-4-3H4z M8 8h8 M8 12h6',arrow:'M5 12h14 M13 6l6 6-6 6'};
const icon=k=>'<svg aria-hidden="true" class="icon" viewBox="0 0 24 24"><path d="'+paths[k]+'"/></svg>';
const pages={overview:'Overview',rankings:'Players',compare:'Compare',method:'Method'};
const nav=$('#nav');nav.innerHTML=Object.entries(pages).map(([k,n])=>'<a href="#'+k+'">'+icon(k)+n+'</a>').join('');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=v=>Number(v).toLocaleString('en-US'),dec=(v,n=1)=>v==null?'—':v.toFixed(n),pct=v=>v==null?'—':(100*v).toFixed(1)+'%',rnk=v=>v?'#'+v:'Outside eligibility';
const names={bat:'Batting',bowl:'Bowling'},sing={bat:'batter',bowl:'bowler'},roles={top:'Top order',middle:'Middle order',lower:'Lower order',Spin:'Spin',Pace:'Pace'};
const style=p=>roles[p.style]||p.style, roleName=p=>p.role==='bat'?'Batter':'Bowler',phases={powerplay:'Powerplay',middle:'Middle',death:'Death'};
let data=null,state={role:'bat',page:'overview',q:'',pool:'eligible',pageNum:1,a:null,b:null},lastProfile=null;
const PAGE=20;
function announce(s){$('#announcer').textContent=s}
function rows(){return data.players.filter(p=>p.role===state.role)}
function ranked(){return rows().filter(p=>p.rank).sort((a,b)=>a.rank-b.rank)}
function roster(){return rows().slice().sort((a,b)=>(a.rank??Infinity)-(b.rank??Infinity)||a.name.localeCompare(b.name))}
function player(id){return data.players.find(p=>p.role===state.role&&p.id===Number(id))}
function navpage(){let h=location.hash.slice(1);return Object.hasOwn(pages,h)?h:'overview'}
function switcher(){return '<div class="switch" role="group" aria-label="Player discipline">'+Object.entries(names).map(([k,n])=>'<button type="button" data-role="'+k+'" aria-pressed="'+(state.role===k)+'">'+n+'</button>').join('')+'</div>'}
function heading(k,title,desc,side=''){return '<header class="intro"><div><div class="eyebrow">'+k+'</div><h1>'+title+'</h1><p>'+desc+'</p></div>'+side+'</header>'}
function files(){return '<div class="stackFiles"><a href="/files/brief.pptx" download>Competition presentation <span>PPTX ↓</span></a><a href="/files/report.pdf" download>Methodology &amp; evidence <span>PDF ↓</span></a><a href="/files/unstop.txt" download>Unstop submission order <span>TXT ↓</span></a></div>'}
function metric(k,v,sub){return '<div class="metric"><span class="label">'+k+'</span><strong>'+v+'</strong><small>'+sub+'</small></div>'}
function str(k,v){return '<div class="statRow"><span>'+k+'</span><b>'+v+'</b></div>'}
function phasesChart(p){return Object.entries(phases).map(([k,t])=>'<div class="phaseLine"><span>'+t+'</span><span class="track"><span class="fill" style="width:'+(100*p.phase[k]/Math.max(p.balls,1))+'%"></span></span><span class="num">'+p.phase[k]+'</span></div>').join('')}
function intervals(players){let lo=Math.floor(Math.min(0,...players.map(p=>p.ci[0]))/10)*10,hi=Math.ceil(Math.max(...players.map(p=>p.ci[1]))/10)*10;let pos=v=>100*(v-lo)/(hi-lo)+'%';
return '<div class="intervals"><div class="forest-head"><div>Rank · Player</div><div style="display:flex;justify-content:space-between"><span>'+lo+'</span><span>'+hi+'</span></div><div>Score</div></div>'+players.map(p=>{let hint=p.name+' · Score '+dec(p.score)+' · 95% interval '+dec(p.ci[0])+' to '+dec(p.ci[1]);return '<button class="forest-row" data-player="'+p.id+'" data-tip="'+esc(hint)+'" aria-label="'+esc(hint)+'. Open profile"><span class="name"><span class="rankno">'+String(p.rank).padStart(2,'0')+'</span>'+esc(p.name)+'</span><span class="whisker" style="--zero:'+pos(0)+';--l:'+pos(p.ci[0])+';--r:'+pos(p.ci[1])+';--v:'+pos(p.score)+'"><span class="dot"></span></span><span class="num">'+dec(p.score)+'</span></button>'}).join('')+'</div><div class="caption">Dot = frozen score. Line = 95% match-bootstrap interval. The vertical guide marks zero. Select a player for exact values.</div>'}
function overview(){let all=ranked(),p=all[0],a=data.audit,v=data.validation[state.role];let verdict=p.role==='bat'?f(p.runs)+' runs for '+p.wickets+' dismissals':p.wickets+' wickets for '+f(p.runs)+' runs conceded';return heading('IPL 2027 auction · Round 1','Pressure board','Explore who delivered under pressure and how much evidence supports each ranking.',switcher())+
'<section class="hero"><div><div class="eyebrow">Leading '+sing[p.role]+' · Rank 01</div><h2>'+esc(p.name)+'</h2><p>'+verdict+' across '+f(p.balls)+' pressure balls. Positive adjusted value in '+pct(p.positive)+' of '+p.matches+' material pressure matches.</p><button class="action primary" data-player="'+p.id+'">Open player dossier '+icon('arrow')+'</button></div><div class="heroChart"><div class="charttitle">Where the pressure came</div><div class="label">Pressure balls by innings phase</div>'+phasesChart(p)+'</div></section><div class="metrics">'+metric('Pressure balls*',f(a.pressure_deliveries),'flagged deliveries')+metric('Match coverage',f(a.scored_matches),'scored matches')+metric('Eligible '+(p.role==='bat'?'batters':'bowlers'),all.length,'passed all three gates')+metric('Bootstrap draws',f(data.config.bootstrap),'whole matches per sample')+'</div><div class="dual"><section class="panel"><div class="panelHead"><div><div class="eyebrow">Selection order</div><h2>Top 10 '+names[p.role].toLowerCase()+' scores</h2><p>Adjusted run-equivalents per 100 balls</p></div></div>'+intervals(all.slice(0,10))+'</section><div class="pile"><section class="panel pad"><div class="eyebrow">Forward check</div><h2>Does rank carry over?</h2><p class="sub">Earlier rankings versus 2026 performance.</p><div class="line"></div>'+str('Spearman correlation',dec(v.validation_spearman,3))+str('Players with enough exposure',v.validation_overlap)+'<div class="note">The held-out season shows weak rank persistence. Treat these rankings as scouting evidence.</div><div class="line"></div><a href="#method" class="inlineButton">Read the validation method</a></section><section class="panel pad"><div class="eyebrow">Submission</div><h2>Judge’s pack</h2>'+files()+'</section></div></div>'}
function playerList(){let v=state.pool;return roster().filter(p=>(v==='all'||(v==='eligible'&&p.rank)||(v==='top'&&p.rank&&p.rank<=10)||(v==='unranked'&&!p.rank))&&p.name.toLowerCase().includes(state.q.trim().toLowerCase()))}
function tableBody(){let arr=playerList();let max=Math.max(1,Math.ceil(arr.length/PAGE));state.pageNum=Math.max(1,Math.min(state.pageNum,max));let start=(state.pageNum-1)*PAGE;return '<div class="tablewrap"><table class="rankTable"><caption class="visually-hidden">Players sorted by frozen rank, followed by unranked players alphabetically</caption><thead><tr><th scope="col">Rank</th><th scope="col">Player</th><th scope="col">Score</th><th scope="col">Pressure balls</th><th scope="col">Material matches</th><th scope="col">Top-10 draws</th></tr></thead><tbody>'+arr.slice(start,start+PAGE).map(p=>'<tr><td class="rank">'+(p.rank?'#'+p.rank:'—')+'</td><td><button data-player="'+p.id+'">'+esc(p.name)+'</button><small>'+esc(style(p))+'</small></td><td class="score">'+(p.rank?dec(p.score):'—')+'</td><td>'+f(p.balls)+'</td><td>'+f(p.matches)+'</td><td>'+pct(p.top10)+'</td></tr>').join('')+'</tbody></table></div>'+(!arr.length?'<p class="empty">No players match this search. Try another name or change the eligibility filter.</p>':'')+'<div class="pager"><span id="count" role="status">'+(arr.length?(start+1)+'–'+Math.min(start+PAGE,arr.length)+' of '+arr.length+' players':'0 players')+'</span><div><button data-move="-1" class="action small" '+(state.pageNum===1?'disabled':'')+'>Previous</button><button data-move="1" class="action small" '+(state.pageNum===max?'disabled':'')+'>Next</button></div></div>'}
function rankings(){return heading('Player explorer','Player rankings','Search every observed player, inspect evidence, and check who qualified for the final order.',switcher())+'<section class="panel"><div class="toolbar"><label class="field grow">Search player<input id="search" type="search" placeholder="Enter a player name" value="'+esc(state.q)+'"></label><label class="field">Eligibility<select id="pool">'+Object.entries({eligible:'Qualified players',top:'Final top 10',unranked:'Below threshold',all:'All observed players'}).map(([k,n])=>'<option value="'+k+'" '+(state.pool===k?'selected':'')+'>'+n+'</option>').join('')+'</select></label><a class="filelink" href="/api/export.csv?role='+state.role+'" download>Download top 10 ↓</a></div><div id="results">'+tableBody()+'</div></section>'}
function comparison(){let choices=ranked();let a=choices.find(p=>p.id===state.a)||choices[0];let b=choices.find(p=>p.id===state.b&&p.id!==a.id)||choices.find(p=>p.id!==a.id);state.a=a.id;state.b=b.id;
function select(side,selected,other){return '<label class="pick">Player '+side.toUpperCase()+'<select id="pick'+side+'">'+choices.map(p=>'<option '+(p.id===selected.id?'selected ':'')+(p.id===other.id?'disabled ':'')+'value="'+p.id+'">#'+p.rank+' · '+esc(p.name)+'</option>').join('')+'</select></label>'}
let fields=[['Frozen rank',p=>'#'+p.rank],['Pressure score',p=>dec(p.score)],['95% score interval',p=>p.ci.map(n=>dec(n)).join(' to ')],['Pressure balls',p=>f(p.balls)],['Ordinary balls',p=>f(p.normal_balls)],['Adjusted pressure value / 100',p=>dec(p.pressure_rate)],['Adjusted ordinary value / 100',p=>dec(p.normal_rate)],['Material pressure matches',p=>f(p.matches)],['Positive material matches',p=>pct(p.positive)],['Top-10 share of resamples',p=>pct(p.top10)],['IPL pressure exposure',p=>f(p.ipl_balls)+' balls'],['Strict pressure rank',p=>rnk(p.strict)],['Loose pressure rank',p=>rnk(p.loose)]];
return heading('Side by side','Player comparison','Compare two eligible players within the same discipline. All values use the same frozen configuration.',switcher())+'<section class="panel comparison"><div class="pad"><h2>Choose two players</h2><div class="comparePick">'+select('a',a,b)+select('b',b,a)+'</div><table class="compareTable"><thead><tr><th>Measure</th><th>'+esc(a.name)+'</th><th>'+esc(b.name)+'</th></tr></thead><tbody>'+fields.map(([label,fn])=>'<tr><td>'+label+'</td><td>'+fn(a)+'</td><td>'+fn(b)+'</td></tr>').join('')+'</tbody></table></div></section>'}
function method(){let a=data.audit,c=data.config;return heading('Model documentation','Inside the model','Follow a delivery from the competition score ledger to the final player order.')+'<div class="methods"><section class="panel pad"><div class="eyebrow">01 · Context</div><h2>Identify pressure before the ball</h2><p>For a team setting a target, flag the last 24 legal balls, or a collapse with five wickets down after 60 legal balls.</p><p>In a live chase with a required rate of at most 18, flag a required rate of at least 10, the last 24 balls at a required rate of 6–12, or six wickets down at a required rate of at least 8.</p></section><section class="panel pad"><div class="eyebrow">02 · Expectation</div><h2>Adjust for the situation</h2><p>Each season uses earlier seasons to estimate context. Baselines separate IPL and T20I, innings and phase. Striker baselines also use batting-order band. Sparse groups receive 100 prior deliveries.</p><p>Batting rewards runs and charges seven run-equivalents for a dismissal to the dismissed batter. Bowling rewards eight per bowler-credited wicket and subtracts charged runs.</p></section><section class="panel pad"><div class="eyebrow">03 · Ranking</div><h2>Reward pressure value and repeatability</h2><code class="formula">Score = (P − 0.35 × N) × B / (B + 180) × (0.8 + 0.2 × F)</code><p>P and N denote context-adjusted pressure and ordinary value per 100 balls. B is pressure balls. F is the share of material pressure matches with positive value.</p><p>Players need '+c.pressure_min+' pressure balls, '+c.ordinary_min+' ordinary balls and '+c.match_min+' material matches. Material means at least four pressure balls for a batter or six for a bowler.</p></section><section class="panel pad"><div class="eyebrow">04 · Validation</div><h2>Separate history from prediction</h2><p>Use 2022 for baseline training. Compare pre-2026 eligible players with their 2026 scores when they have at least 30 pressure and 30 ordinary balls and three material matches in 2026.</p>'+str('Batting · rank correlation',dec(data.validation.bat.validation_spearman,3))+str('Bowling · rank correlation',dec(data.validation.bowl.validation_spearman,3))+'<p>Resample whole matches '+c.bootstrap+' times with a fixed eligible cohort. Intervals condition on the fitted baselines and ranking rules. A top-10 share is a historical resampling frequency.</p></section><section class="panel pad"><div class="eyebrow">05 · Score reconciliation</div><h2>What entered the model?</h2>'+str('Supplied deliveries',f(a.raw_deliveries))+str('Super-over deliveries excluded',a.super_over_rows)+str('Result margins checked',f(a.match_results_checked))+str('Margin discrepancies',a.margin_mismatch_ids.length)+str('Matches retained before warm-up',a.retained_matches)+str('Deliveries scored',f(a.scored_deliveries))+'<p>Exclude revised, incomplete, out-of-scope and anomalous matches. The report details how wides, no-balls, non-striker dismissals and secondary extras enter each ledger.</p></section><section class="panel pad"><div class="eyebrow">06 · Selection decision</div><h2>Check transferability</h2><p>IPL pressure exposure is shown separately in each dossier. A T20I-only resume needs domestic scouting before an IPL auction decision. Availability, contract status, opposition quality and price are outside the model.</p>'+files()+'</section></div>'}
function dossier(p){lastProfile=p;let eligible=Boolean(p.rank),isBat=p.role==='bat';let d=$('#dossier');
let notes=eligible?(p.top10<.5?'This player finished outside the top ten in most match resamples.':'This player finished in the top ten in '+pct(p.top10)+' of match resamples.'):'This player falls below at least one exposure threshold. The frozen submission assigns no rank.';
d.innerHTML='<div class="eyebrow">'+roleName(p)+' · '+esc(style(p))+' · '+(eligible?'Rank '+p.rank:'Below threshold')+'</div><h2 id="playername">'+esc(p.name)+'</h2><p class="muted" style="margin:10px 0 18px">'+f(p.runs)+(isBat?' runs and '+p.wickets+' dismissals':' runs conceded and '+p.wickets+' credited wickets')+' across '+f(p.balls)+' pressure balls.</p><div class="grid"><div class="box"><span class="label">Frozen rating</span><span class="accentNum">'+(eligible?dec(p.score):'—')+'</span></div><div class="box"><span class="label">95% score interval</span><strong style="padding-top:5px">'+(p.ci?p.ci.map(n=>dec(n)).join(' to '):'Unavailable')+'</strong></div></div><div class="line"></div><h3>Pressure vs ordinary performance</h3>'+str('Pressure value / 100 balls',dec(p.pressure_rate))+str('Ordinary value / 100 balls',dec(p.normal_rate))+str('Pressure balls / ordinary balls',f(p.balls)+' / '+f(p.normal_balls))+str('Material pressure matches',p.matches)+str('Positive share of material matches',pct(p.positive))+'<div class="line"></div><h3>Where the evidence comes from</h3>'+str('IPL / T20I pressure balls',f(p.ipl_balls)+' / '+f(p.balls-p.ipl_balls))+phasesChart(p)+'<div class="line"></div><h3>Ranking stability</h3>'+str('Top-ten share of resamples',pct(p.top10))+str('Stricter / looser rule rank',(p.strict?'#'+p.strict:'Outside eligibility')+' / '+(p.loose?'#'+p.loose:'Outside eligibility'))+str('Eligible rank before 2026',p.prior_rank?'#'+p.prior_rank:'Outside eligibility')+str('2026 score in validation sample',dec(p.holdout_score))+'<div class="note">'+notes+(p.ipl_balls===0?' All recorded pressure exposure was in T20Is.':'')+'</div>';
if(!dialog.open)dialog.showModal();dialog.scrollTop=0;$('#close').focus();hideTip()}
function render(){state.page=navpage();$('#current').textContent=pages[state.page];nav.querySelectorAll('a').forEach(a=>{if(a.hash==='#'+state.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});if(!data)return;root.innerHTML=({overview,rankings,compare:comparison,method})[state.page]()+'<footer class="source">Source · SupeRR Selector Season 2 competition data pack · Freeze '+esc(data.freeze)+' · *Pressure delivery count includes illegal deliveries.</footer>';root.setAttribute('aria-busy','false');hideTip()}
function hideTip(){tip.hidden=true}
function showTip(el,x,y){tip.textContent=el.dataset.tip;tip.hidden=false;tip.style.left=Math.min(Math.max(6,x+12),window.innerWidth-tip.offsetWidth-8)+'px';tip.style.top=Math.min(Math.max(6,y+12),window.innerHeight-tip.offsetHeight-8)+'px'}
root.addEventListener('pointerover',e=>{let el=e.target.closest('[data-tip]');if(el&&e.pointerType!=='touch')showTip(el,e.clientX,e.clientY)});
root.addEventListener('pointerout',e=>{if(!e.relatedTarget||!e.target.closest('[data-tip]')?.contains(e.relatedTarget))hideTip()});
root.addEventListener('focusin',e=>{let el=e.target.closest('[data-tip]');if(el){let b=el.getBoundingClientRect();showTip(el,b.left,b.bottom)}});root.addEventListener('focusout',hideTip);
root.addEventListener('click',e=>{let el=e.target.closest('button');if(!el)return;if(el.dataset.role){state.role=el.dataset.role;state.pageNum=1;state.a=null;state.b=null;render();root.querySelector('[data-role="'+state.role+'"]').focus({preventScroll:true});announce(names[state.role]+' selected')}else if(el.dataset.player){let p=player(el.dataset.player);if(p)dossier(p)}else if(el.dataset.move){state.pageNum+=Number(el.dataset.move);$('#results').innerHTML=tableBody();$('#count').tabIndex=-1;$('#count').focus({preventScroll:true})}else if(el.id==='retry'){load()}});
root.addEventListener('input',e=>{if(e.target.id==='search'){state.q=e.target.value;state.pageNum=1;$('#results').innerHTML=tableBody()}});
root.addEventListener('change',e=>{if(e.target.id==='pool'){state.pool=e.target.value;state.pageNum=1;$('#results').innerHTML=tableBody()}else if(['picka','pickb'].includes(e.target.id)){state[e.target.id.slice(-1)]=Number(e.target.value);let id=e.target.id;render();$('#'+id).focus();announce('Comparison updated')}});
$('#close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',e=>{if(e.target!==dialog)return;let b=dialog.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)dialog.close()});window.addEventListener('hashchange',()=>{if(dialog.open)dialog.close();render();window.scrollTo(0,0);if(location.hash!=='#content')$('#content').focus({preventScroll:true})});document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});
async function load(){root.setAttribute('aria-busy','true');$('#freeze').textContent='Loading data';try{let res=await fetch('/api/snapshot');if(!res.ok)throw Error('Unavailable');let j=await res.json();if(!j.players?.length||!j.freeze)throw Error('Empty snapshot');data=j;$('#freeze').textContent='Frozen model '+data.config.version;render()}catch{root.setAttribute('aria-busy','false');$('#freeze').textContent='Data unavailable';root.innerHTML='<section class="load" role="alert"><h2>Rankings could not load</h2><p>Check the connection to the application and retry.</p><button class="action" id="retry">Retry loading</button></section>'}}
load();
</script></body></html>
